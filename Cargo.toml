[package]
name = "croscomp"
version = "0.1.0"
authors = ["Kristian H. Kristensen <hoegsberg@google.com>"]
edition = "2018"
build = "build.rs"

[dependencies]
wayland-scanner = { path = "third_party/wayland-scanner" }
wayland-commons = { path = "third_party/wayland-commons" }
wayland-client = { path = "third_party/wayland-client" }
drm = { path = "third_party/drm" }
once_cell = { path = "third_party/once_cell" }

tempfile = ">=2.0, <4.0"
libc = "0.2.65"

[build-dependencies]
wayland-scanner = { version = "0.28.2", path = "third_party/wayland-scanner" }
bindgen = ">=0.56"
