[package]
name = "croscomp"
version = "0.1.0"
authors = ["Kristian H. Kristensen <hoegsberg@google.com>"]
edition = "2018"
build = "build.rs"

[dependencies]
wayland-scanner = { path = "third_party/wayland-scanner" }
wayland-commons = { path = "third_party/wayland-commons" }
wayland-sys = { path = "third_party/wayland-sys" }
wayland-server = { path = "third_party/wayland-server", features = ["use_system_lib"] }
bitflags = "1.0"
nix = "*"

[build-dependencies]
wayland-scanner = { version = "0.28.2", path = "third_party/wayland-scanner" }
